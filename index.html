<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文華國小 路隊與通勤方式調查</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    /* 隱藏預設捲軸，讓手機端畫面更俐落 */
    ::-webkit-scrollbar { display: none; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100">

  <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative pb-20">
    <!-- 頂部橫幅 -->
    <header class="bg-indigo-600 text-white p-6 rounded-b-3xl shadow-md">
      <h1 class="text-2xl font-bold tracking-wider mb-1">路隊與通勤調查</h1>
      <p class="text-indigo-100 text-sm">115學年度 上學期</p>
    </header>

    <main class="p-6 space-y-8 -mt-2">
      <!-- 區段一：基本資料 -->
      <section class="space-y-4">
        <h2 class="font-bold text-lg border-l-4 border-indigo-500 pl-2 text-slate-700">基本資料</h2>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">座號</label>
            <input v-model="form.seat" type="number" placeholder="例: 01" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">學生姓名</label>
            <input v-model="form.name" type="text" placeholder="真實姓名" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
        </div>
      </section>

      <!-- 區段二：上學方式 -->
      <section class="space-y-4">
        <h2 class="font-bold text-lg border-l-4 border-emerald-500 pl-2 text-slate-700 flex items-baseline gap-1">
          上學通勤方式 
          <span class="text-sm font-normal text-slate-400">(選擇主要方式即可)</span>
        </h2>
        <div class="grid grid-cols-2 gap-3">
          <label v-for="method in morningOptions" :key="method" :class="['border rounded-xl p-3 text-center cursor-pointer transition flex flex-col items-center gap-1', form.morning === method ? 'bg-emerald-50 border-emerald-500 text-emerald-700 ring-1 ring-emerald-500' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50']">
            <input type="radio" v-model="form.morning" :value="method" class="hidden">
            <span class="font-medium">{{ method }}</span>
          </label>
        </div>
      </section>

      <hr class="border-slate-100">

      <!-- 區段三：放學方式分流 -->
      <section class="space-y-4">
        <h2 class="font-bold text-lg border-l-4 border-amber-500 pl-2 text-slate-700">放學路隊設定</h2>
        <p class="text-sm text-slate-500">請問孩子一週五天的放學方式都相同嗎？</p>
        
        <div class="flex bg-slate-100 p-1 rounded-xl">
          <button @click="form.isSameEveryday = true" :class="['flex-1 py-2 rounded-lg text-sm font-bold transition', form.isSameEveryday ? 'bg-white shadow text-indigo-600' : 'text-slate-400']">
            是的，每天都一樣
          </button>
          <button @click="form.isSameEveryday = false" :class="['flex-1 py-2 rounded-lg text-sm font-bold transition', !form.isSameEveryday ? 'bg-white shadow text-indigo-600' : 'text-slate-400']">
            不是，每天不同
          </button>
        </div>

        <!-- 模式 A：每天相同 -->
        <div v-if="form.isSameEveryday" class="animate-[fadeIn_0.3s_ease-out] space-y-4 mt-4">
          <div class="space-y-2">
            <label v-for="route in routeOptions" :key="route.id" :class="['block border rounded-xl p-4 cursor-pointer transition', form.unified.route === route.name ? 'bg-indigo-50 border-indigo-400 ring-1 ring-indigo-400' : 'bg-white border-slate-200']">
              <input type="radio" v-model="form.unified.route" :value="route.name" class="hidden">
              <div class="font-bold text-slate-800">{{ route.name }}</div>
              <div class="text-xs text-slate-500 mt-1">{{ route.desc }}</div>
            </label>
          </div>
          
          <div v-if="needsCareInfo(form.unified.route)" class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 space-y-3">
            <label class="block text-sm font-bold text-indigo-800">安親班/補習班資訊</label>
            <input v-model="form.unified.careName" type="text" placeholder="安親班名稱" class="w-full bg-white border border-indigo-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-400">
            <input v-model="form.unified.carePhone" type="tel" placeholder="聯絡電話" class="w-full bg-white border border-indigo-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-400">
          </div>
        </div>

        <!-- 模式 B：每天不同 (逐日填寫) -->
        <div v-else class="animate-[fadeIn_0.3s_ease-out] space-y-6 mt-4">
          <div v-for="(day, index) in days" :key="day.key" class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
            <div class="bg-slate-100 px-4 py-2 font-bold text-slate-700 flex justify-between items-center">
              {{ day.label }}
              <span v-if="form.daily[day.key].route" class="text-xs text-indigo-600 bg-indigo-100 px-2 py-1 rounded-full">已選擇</span>
            </div>
            <div class="p-4 space-y-3">
              <select v-model="form.daily[day.key].route" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:border-indigo-500 appearance-none">
                <option value="" disabled>請選擇路隊...</option>
                <option v-for="route in routeOptions" :key="route.id" :value="route.name">{{ route.name }}</option>
              </select>

              <div v-if="needsCareInfo(form.daily[day.key].route)" class="grid grid-cols-2 gap-2 mt-2">
                <input v-model="form.daily[day.key].careName" type="text" placeholder="安親班名稱" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400">
                <input v-model="form.daily[day.key].carePhone" type="tel" placeholder="聯絡電話" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400">
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部送出區塊 -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur border-t border-slate-200 p-4">
      <button @click="submitForm" id="submitBtn" :disabled="!isFormValid" :class="['w-full py-3.5 rounded-xl font-bold text-lg shadow-lg transition transform active:scale-95 flex justify-center items-center gap-2', isFormValid ? 'bg-indigo-600 hover:bg-indigo-700 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed']">
        <span>送出資料</span>
        <svg v-if="isFormValid" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        const morningOptions = ['搭乘公車', '家長機車接送', '家長汽車接送', '步行到校'];
        const routeOptions = [
          { id: 'R1', name: '第一路隊 (大門)', desc: '自行走路、前門家長接送、5人以下安親班' },
          { id: 'R2', name: '第二路隊 (後門)', desc: '自行走路、後門家長接送' },
          { id: 'R3', name: '第三路隊 (側門)', desc: '5人以上校外安親班、側門家長接送' },
          { id: 'R4', name: '第四路隊', desc: '校內安親班、課後社團' }
        ];
        const days = [
          { key: 'mon', label: '星期一' }, { key: 'tue', label: '星期二' },
          { key: 'wed', label: '星期三' }, { key: 'thu', label: '星期四' }, { key: 'fri', label: '星期五' }
        ];

        const form = ref({
          seat: '',
          name: '',
          morning: '',
          isSameEveryday: true,
          unified: { route: '', careName: '', carePhone: '' },
          daily: {
            mon: { route: '', careName: '', carePhone: '' },
            tue: { route: '', careName: '', carePhone: '' },
            wed: { route: '', careName: '', carePhone: '' },
            thu: { route: '', careName: '', carePhone: '' },
            fri: { route: '', careName: '', carePhone: '' }
          }
        });

        const needsCareInfo = (routeName) => {
          if (!routeName) return false;
          return routeName.includes('第一路隊') || routeName.includes('第三路隊') || routeName.includes('第四路隊');
        };

        const isFormValid = computed(() => {
          if (!form.value.seat || !form.value.name || !form.value.morning) return false;
          if (form.value.isSameEveryday) {
            return !!form.value.unified.route;
          } else {
            return days.every(day => !!form.value.daily[day.key].route);
          }
        });

        const submitForm = async () => {
          const payload = {
            seat: form.value.seat,
            name: form.value.name,
            morningCommute: form.value.morning,
            schedule: {}
          };

          if (form.value.isSameEveryday) {
            days.forEach(day => {
              payload.schedule[day.key] = { ...form.value.unified };
            });
          } else {
            payload.schedule = { ...form.value.daily };
          }

          // ⚠️ 請將下方的網址替換為您從 Apps Script 發布後取得的 Web App URL
          const GAS_WEBHOOK_URL = 'https://script.google.com/macros/s/您的專屬ID/exec'; 
          
          try {
            const btn = document.getElementById('submitBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '資料傳送中...';
            btn.disabled = true;

            await fetch(GAS_WEBHOOK_URL, {
              method: 'POST',
              body: JSON.stringify(payload),
              headers: { 'Content-Type': 'text/plain;charset=utf-8' } // 使用 text/plain 避免跨網域預檢(CORS preflight)阻擋
            });

            alert('資料已成功送出！感謝您的填寫。');
            window.location.reload(); // 送出成功後重整頁面，清空表單
          } catch (error) {
            alert('傳送失敗，請確認網路連線或稍後再試。');
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '送出資料';
            btn.disabled = false;
          }
        };

        return { form, morningOptions, routeOptions, days, needsCareInfo, isFormValid, submitForm };
      }
    }).mount('#app');
  </script>
</body>
</html>
